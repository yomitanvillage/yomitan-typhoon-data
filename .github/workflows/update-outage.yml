name: Update Yomitan Outage Data

on:
  schedule:
    # 15分ごと（GitHub側の負荷状況により数分ずれることがあります）
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-outage
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and parse outage data
        run: python scripts/fetch_outage.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yomitan_outage.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update yomitan outage data [skip ci]"
            git push
          fi
